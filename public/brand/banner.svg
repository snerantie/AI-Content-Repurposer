<svg width="1600" height="400" viewBox="0 0 1600 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Content Repurposer banner">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="0.55" stop-color="#111133"/>
      <stop offset="1" stop-color="#1e1052"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bbolt" x1="120" y1="120" x2="220" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9d5ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <filter id="bsoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1600" height="400" fill="url(#bbg)"/>
  <rect x="0" y="0" width="1600" height="400" fill="url(#glow)"/>

  <!-- One input node on the left, connecting lines to 5 output chips on the right -->
  <g stroke="url(#accent)" stroke-width="3" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M300 200 C 520 200, 700 96, 1120 96"/>
    <path d="M300 200 C 520 200, 700 148, 1120 148"/>
    <path d="M300 200 C 520 200, 700 200, 1120 200"/>
    <path d="M300 200 C 520 200, 700 252, 1120 252"/>
    <path d="M300 200 C 520 200, 700 304, 1120 304"/>
  </g>

  <!-- Input node -->
  <circle cx="300" cy="200" r="16" fill="url(#accent)"/>

  <!-- Lightning bolt + wordmark -->
  <g filter="url(#bsoft)">
    <path fill="url(#bbolt)" d="M176 92 L96 210 L146 210 L134 300 L214 182 L164 182 Z"/>
  </g>
  <text x="240" y="150" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#ffffff">AI Content Repurposer</text>
  <text x="240" y="210" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="500" fill="#c4b5fd">Turn one idea into a week of content.</text>

  <!-- Output chips (clean vector dot marks so they rasterize crisply without emoji fonts) -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600">
    <g transform="translate(1120,72)">
      <rect width="360" height="48" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="url(#accent)" stroke-width="1.5"/>
      <circle cx="30" cy="24" r="7" fill="url(#accent)"/>
      <text x="52" y="31" fill="#e5e7eb">Tweet</text>
    </g>
    <g transform="translate(1120,124)">
      <rect width="360" height="48" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="url(#accent)" stroke-width="1.5"/>
      <circle cx="30" cy="24" r="7" fill="url(#accent)"/>
      <text x="52" y="31" fill="#e5e7eb">X Thread</text>
    </g>
    <g transform="translate(1120,176)">
      <rect width="360" height="48" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="url(#accent)" stroke-width="1.5"/>
      <circle cx="30" cy="24" r="7" fill="url(#accent)"/>
      <text x="52" y="31" fill="#e5e7eb">LinkedIn</text>
    </g>
    <g transform="translate(1120,228)">
      <rect width="360" height="48" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="url(#accent)" stroke-width="1.5"/>
      <circle cx="30" cy="24" r="7" fill="url(#accent)"/>
      <text x="52" y="31" fill="#e5e7eb">Instagram</text>
    </g>
    <g transform="translate(1120,280)">
      <rect width="360" height="48" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="url(#accent)" stroke-width="1.5"/>
      <circle cx="30" cy="24" r="7" fill="url(#accent)"/>
      <text x="52" y="31" fill="#e5e7eb">Newsletter</text>
    </g>
  </g>
</svg>
