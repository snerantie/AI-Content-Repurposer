<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Content Repurposer icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bolt" x1="220" y1="120" x2="300" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9d5ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0a0a0a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle "one to many" dots: single input node on the left, fan of outputs on the right -->
  <g opacity="0.35" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M150 256 C 210 256, 250 130, 340 130"/>
    <path d="M150 256 C 210 256, 250 193, 340 193"/>
    <path d="M150 256 C 210 256, 250 256, 340 256"/>
    <path d="M150 256 C 210 256, 250 319, 340 319"/>
    <path d="M150 256 C 210 256, 250 382, 340 382"/>
  </g>
  <g opacity="0.55" fill="#ffffff">
    <circle cx="340" cy="130" r="14"/>
    <circle cx="340" cy="193" r="14"/>
    <circle cx="340" cy="256" r="14"/>
    <circle cx="340" cy="319" r="14"/>
    <circle cx="340" cy="382" r="14"/>
  </g>

  <!-- Lightning bolt motif -->
  <path filter="url(#soft)" fill="url(#bolt)"
        d="M291 96 L163 286 L241 286 L221 416 L349 226 L271 226 Z"/>
</svg>
